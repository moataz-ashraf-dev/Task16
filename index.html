<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task 16</title>
    <link rel="stylesheet" href="index.css" />
    <!-- bootstrapLink -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body class="body p-0">
    <nav class="w-100 nav1 d-flex justify-content-between align-items-center">
      <div>
        <div
          class="n-div h-100 d-flex justify-content-center align-items-center gap-1 ms-5"
        >
          <i
            class="fa-brands fa-staylinked fs-3 fs-md-1"
            style="color: #00e5ff"
          ></i>
          <p class="fs-5 fs-md-2 mb-0 ps-2" style="color: #00e5ff">CRUD</p>
        </div>
      </div>
      <div class="me-3 d-flex flex-column">
        <p class="p-0 m-0 fst-italic fw-bold" style="color: #00e5ff">
          Show Users Data
        </p>
        <button class="btn btn-outline-dark" onclick="showUsers()">
          <i class="fa-solid fa-bars fs-5 fs-md-2 icon"></i>
        </button>
      </div>
    </nav>

    <section
      class="hero-section mt-5 row justify-content-center align-items-center p-0 m-0"
    >
      <div
        class="h-div h-100 rounded-5 d-flex align-items-center flex-column gap-2 overflow-hidden text-center col-10 col-lg-5"
      >
        <h1 class="fst-italic text-info-emphasis w-100 mt-4 fs-1 fw-bolder">
          Building a user base
        </h1>
        <p
          class="fst-italic text-info-emphasis w-75 mt-4 fs-4 fw-bolder align-items-center"
        >
          Ready to build your audience and user base?
        </p>
        <p
          class="fst-italic text-info-emphasis w-75 mt-4 fs-4 fw-bolder align-items-center"
        >
          All creation, modification, and deletion logs will be displayed in the
          console, not on the webpage.
        </p>
        <div
          class="h-div2 w-100 h-25 mt-auto d-flex gap-4 flex-column align-items-center justify-content-center"
        >
          <div
            class="btn1 d-flex align-items-center justify-content-center w-100"
          >
            <button
              class="btn fs-3 w-100"
              style="
                background-color: #00adb5;
                color: #121212;
                border-radius: 8px;
              "
              onclick="firstMessageIfYes()"
            >
              Yes
            </button>
          </div>
          <div
            class="btn2 d-flex align-items-center justify-content-center w-100 rounded-1"
          >
            <button
              onclick="firstMessageIfNo()"
              class="btn fs-3 w-100"
              style="
                background-color: #2d2d34;
                border-radius: 8px;
                color: #e0e0e0;
              "
            >
              No
            </button>
          </div>
        </div>
      </div>
    </section>
    <footer class="w-100 mt-5 d-flex justify-content-around row g-1">
      <div class="h-100 col-4 col-lg-3 rounded-4 overflow-hidden mt-0">
        <button
          onclick="creating()"
          class="btn btn-dark h-100 w-100 fs-6 fs-lg-3 fw-medium fst-italic text-info-emphasis"
        >
          Creation
        </button>
      </div>
      <div class="h-100 col-4 col-lg-3 rounded-4 overflow-hidden mt-0">
        <button
          onclick="Update()"
          class="btn btn-dark h-100 w-100 fs-6 fs-lg-3 fw-medium fst-italic text-info-emphasis"
        >
          Update
        </button>
      </div>
      <div class="h-100 col-4 col-lg-3 rounded-4 overflow-hidden mt-0">
        <button
          onclick="deletUser()"
          class="btn btn-dark h-100 w-100 fs-6 fs-lg-3 fw-medium fst-italic text-info-emphasis"
        >
          Deletion
        </button>
      </div>
    </footer>

    <script src="./index.js"></script>
  </body>
</html>
